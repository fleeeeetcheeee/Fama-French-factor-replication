name: tests

# The offline suite: a clean install from the pinned lock, no WRDS extracts and
# no reference downloads. Data-dependent tests skip themselves; everything else
# must pass. Licensed-data validation (tests/integration/test_bottom_up.py and
# the FFREP_WRDS_TESTS suites) runs locally, never here.

on:
  push:
  pull_request:

jobs:
  offline:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install the pinned environment
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.lock
          pip install -e . --no-deps
      - name: Check the environment is consistent
        run: pip check
      - name: Test
        run: pytest
