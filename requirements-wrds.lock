# Optional WRDS access, on top of requirements.lock:
#
#     pip install -r requirements.lock -r requirements-wrds.lock
#     pip install -e . --no-deps
#
# Only a PostgreSQL driver and SQLAlchemy: ffrep connects to WRDS directly
# (universe/wrds_source.py) instead of through the `wrds` package, whose every
# release pins pandas<2.3 against the pandas 3.0.5 in requirements.lock. The
# password is read by libpq from ~/.pgpass; nothing in this repository stores it.
