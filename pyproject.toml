[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ffrep"
version = "0.1.0"
description = "Bottom-up construction of the Fama-French and q-factor portfolios, benchmarked against Ken French's published series"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.2.0",
    "numpy>=1.26.0",
    "scipy>=1.12.0",
    "pyarrow>=15.0.0",
    "duckdb>=0.10.0",
    "polars>=1.0.0",
    "requests>=2.31.0",
    "yfinance>=0.2.40",
    "tqdm>=4.66.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "hypothesis>=6.100.0",
    "matplotlib>=3.8.0",
]

# Install with --no-deps. The wrds package declares "pandas<2.3", which is a
# stale pin rather than a real incompatibility: it connects and queries fine
# against the pandas 3.0.5 this project is verified on. Installing it normally
# silently downgraded pandas and broke five tests with a datetime64 overflow
# that had nothing to do with WRDS -- an hour spent on a dependency resolver
# masquerading as a bug in our own code.
#
#     pip install --no-deps wrds psycopg2-binary sqlalchemy
wrds = [
    "wrds>=3.5.0",
    "psycopg2-binary>=2.9.0",
    "sqlalchemy>=2.0.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=src/ffrep --cov-report=term-missing -v"

[tool.hatch.build.targets.wheel]
packages = ["src/ffrep"]
